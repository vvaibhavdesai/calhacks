      description: >-
        Flight-recorder events, newest stream_sequence first. Filters are lane-B proposals (Q46).
        Without branch_id only production events are returned. up_to_sequence pins the page set so
        pages stay stable while new events arrive; after_sequence lists only events newer than a pin.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: run_id, in: query, required: false, x-encore-proposal: Q46, schema: { type: string } }
        - $ref: '#/components/parameters/VendorId'
        - { name: aggregate_id, in: query, required: false, x-encore-proposal: Q46, schema: { type: string } }
        - { name: aggregate_type, in: query, required: false, x-encore-proposal: Q46, schema: { $ref: '#/components/schemas/RecordKind' } }
        - { name: actor_type, in: query, required: false, x-encore-proposal: Q46, schema: { $ref: '#/components/schemas/ActorType' } }
        - { name: actor_id, in: query, required: false, x-encore-proposal: Q46, schema: { type: string } }
        - { name: type, in: query, required: false, x-encore-proposal: Q46, description: Exact event type, e.g. policy.suspended., schema: { type: string } }
        - { name: category, in: query, required: false, x-encore-proposal: Q46, schema: { $ref: '#/components/schemas/EventCategory' } }
        - { name: branch_id, in: query, required: false, x-encore-proposal: Q46, description: Absent means production events only., schema: { type: string } }
        - { name: correlation_id, in: query, required: false, x-encore-proposal: Q46, schema: { type: string } }
        - { name: recorded_from, in: query, required: false, x-encore-proposal: Q46, description: Inclusive lower bound on recorded_at (knowledge time)., schema: { $ref: '#/components/schemas/Instant' } }
        - { name: recorded_to, in: query, required: false, x-encore-proposal: Q46, description: Inclusive upper bound on recorded_at., schema: { $ref: '#/components/schemas/Instant' } }
        - { name: up_to_sequence, in: query, required: false, x-encore-proposal: Q46, schema: { type: integer, minimum: 0 } }
        - { name: after_sequence, in: query, required: false, x-encore-proposal: Q46, schema: { type: integer, minimum: 0 } }
      responses:
