  /history/projection:
    get:
      tags: [proposals]
      x-encore-proposal: Q48
      operationId: getHistoricalProjection
      summary: >-
        Read-only reconstruction of what was KNOWN at a knowledge-time cutoff (recorded_at <= cutoff),
        separately filtered by business date (C06). Never mutates anything.
      parameters:
        - $ref: '#/components/parameters/FestivalId'
        - { name: knowledge_cutoff, in: query, required: true, schema: { $ref: '#/components/schemas/Instant' } }
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/VendorId'
        - { name: branch_id, in: query, required: false, description: Absent means production., schema: { type: string } }
      responses:
        '200':
          description: Historical projection labelled with its cutoff, snapshot and later-recorded facts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoricalProjection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /challenges/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q49
      operationId: getChallenge
      parameters: [{ $ref: '#/components/parameters/PathId' }]
