          in: query
          required: false
          x-encore-proposal: Q31
          schema: { $ref: '#/components/schemas/MatchGroupStatus' }
      responses:
        '200':
          description: Reconciliation match groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchGroupList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /reconciliation/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q31
      operationId: getMatchGroup
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Match group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchGroup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /suppliers:
    get:
      tags: [reads]
      operationId: listSuppliers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Suppliers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierList' }
