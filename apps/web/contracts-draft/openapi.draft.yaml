  /reconciliation:
    get:
      tags: [reads]
      operationId: listMatchGroups
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BusinessDate'
