  /events/stream:
    get:
      tags: [reads]
      operationId: streamEvents
      summary: SSE notification stream. Notification only, never a second ledger or a permission grant.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque resume cursor (the last received EventEnvelope.cursor). Also sent as Last-Event-ID.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            text/event-stream. Each `data:` line is one JSON EventEnvelope; the SSE `id:` field
            carries EventEnvelope.cursor. A control event of type `stream.resync_required` means the
            client must refetch projections and reconnect without a cursor.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          x-encore-proposal: Q25
          description: Resume cursor expired; client must resync projections and reconnect without a cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ------------------------------------------------------- C03 commands
  /imports:
    post:
      tags: [commands]
      operationId: createImport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /challenges:
    post:
      tags: [commands]
      operationId: createChallenge
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /corrections/preview:
    post:
      tags: [commands]
      operationId: previewCorrection
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /corrections/{id}/approve:
    post:
      tags: [commands]
      operationId: approveCorrection
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /branches:
    post:
      tags: [commands]
      operationId: createBranch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /replays:
    post:
      tags: [commands]
      operationId: createReplay
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous next_cursor. Never parsed by clients.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      x-encore-proposal: Q24
      schema: { type: integer, minimum: 1, maximum: 200 }
    Sort:
      name: sort
      in: query
      required: false
      x-encore-proposal: Q24
      description: Server-side sort, `field` or `-field`. Ordering must remain stable (ties by id).
      schema: { type: string, pattern: '^-?[a-z_]+$' }
    VendorId:
      name: vendor_id
      in: query
      required: false
      schema: { type: string }
    BusinessDate:
      name: business_date
      in: query
      required: false
      schema: { $ref: '#/components/schemas/BusinessDate' }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for effectful commands; scoped by workspace/action. Same key + same canonical
        payload returns the original result; same key + different payload returns 409.
      schema: { type: string, minLength: 8, maxLength: 200 }

  requestBodies:
    Command:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommandEnvelope' }

  responses:
    Unauthenticated:
      description: 401 unauthenticated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 403 forbidden (authenticated but lacks capability).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 404 not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 409 conflict (version mismatch or idempotency key reused with different payload).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Invalid:
      description: 422 invalid input or domain precondition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 429 rate limited.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: 503 dependency unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ------------------------------------------------------------ C01 basics
    MoneyCents:
      type: string
      description: >-
        USD integer cents as a canonical base-10 string (C01). A leading '-' for refunds is a
        DRAFT assumption (DA07, open question Q4); '-0' and leading zeros are not canonical.
      pattern: '^-?(0|[1-9][0-9]*)$'
      not: { const: '-0' }
    NonNegativeMoneyCents:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    Currency:
      type: string
      enum: [USD]
    BusinessDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: YYYY-MM-DD festival business date in America/Los_Angeles.
    Instant:
      type: string
      format: date-time
      pattern: 'Z$'
      description: UTC RFC3339 instant.
    Version:
      type: integer
      minimum: 1
    BasisPoints:
      type: integer
      minimum: 0
      maximum: 10000
    DecimalString:
      type: string
      pattern: '^[0-9]+\.[0-9]+$'
    SourceRef:
      type: object
      additionalProperties: false
      required: [source_id, source_version, content_hash, locator_kind, locator]
      properties:
        source_id: { type: string }
        source_version: { $ref: '#/components/schemas/Version' }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        locator_kind: { type: string, enum: [row, page, span] }
        locator: { type: string, minLength: 1 }
        quoted_excerpt: { type: string }
    SourceVersionRef:
      type: object
      additionalProperties: false
      required: [source_id, source_version]
      properties:
        source_id: { type: string }
        source_version: { $ref: '#/components/schemas/Version' }

    # ------------------------------------------------------- C03 envelopes
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }
    ErrorResponse:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string }
        message: { type: string, description: User-safe; never secrets or internals. }
        request_id: { type: string }
        retryable: { type: boolean }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        current_version:
          anyOf:
            - { $ref: '#/components/schemas/Version' }
            - { type: 'null' }
    CommandEnvelope:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, payload]
      description: Actor derives from the authenticated session, never from the payload.
      properties:
        command_id: { type: string, minLength: 1 }
        expected_version:
          description: Optimistic concurrency version of the target; null when creating.
          anyOf:
            - { $ref: '#/components/schemas/Version' }
            - { type: 'null' }
        payload:
          type: object
          additionalProperties: true
          x-encore-unspecified: true
          description: Domain-specific; precise models freeze in the shared schema PR.
    CommandResult:
      type: object
      required: [command_id, aggregate_id, version, status]
      x-encore-unspecified: true
      properties:
        command_id: { type: string }
        aggregate_id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
    JobAccepted:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string }
        status_url: { type: string }
        status: { $ref: '#/components/schemas/JobState' }
    JobState:
      type: string
      x-encore-proposal: Q26
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    JobStatus:
      type: object
      x-encore-proposal: Q26
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status: { $ref: '#/components/schemas/JobState' }
        result_ref: { type: [string, 'null'] }
        error: { anyOf: [{ $ref: '#/components/schemas/ErrorResponse' }, { type: 'null' }] }
    NextCursor:
      type: [string, 'null']
      description: Opaque; null when there are no more items.

    Capability:
      type: string
      x-encore-proposal: Q22
      description: Backend-granted capability name. UI hides/disables controls from these only.
    Session:
      type: object
      x-encore-proposal: Q22
      required: [actor_id, capabilities]
      properties:
        actor_id: { type: string }
        display_name: { type: string }
        workspace_id: { type: string }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }

    # --------------------------------------------- C04 state enumerations
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING_REVIEW, PARTIALLY_COMPLETE, COMPLETED, FAILED, CANCELLED]
    VendorMilestone:
      type: string
      enum: [INGESTED, RECONCILED, TERMS_RESOLVED, CALCULATED, CONTROLS_CHECKED, APPROVED]
    PayoutState:
      type: string
      enum: [DRAFT, APPROVED, DISPATCH_PENDING, SUBMITTED, CONFIRMED, REJECTED, FAILED, CANCELLED, UNKNOWN, CANCEL_REQUESTED]
    CaseStatus:
      type: string
      enum: [OPEN, IN_REVIEW, RESOLVED, REJECTED]
    PolicyStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, SUPERSEDED, REVOKED]

    # ------------------------------------ fixture-backed input records
    Custody:
      type: string
      enum: [CENTRALLY_COLLECTED, VENDOR_RETAINED]
    BankDirection:
      type: string
      enum: [credit, debit]
    Booth:
      type: object
      additionalProperties: false
      x-encore-proposal: Q3
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    Vendor:
      type: object
      additionalProperties: false
      required: [id, version, status, festival_id, name, booth_ids, beneficiary_version, active_contract_version]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        festival_id: { type: string }
        name: { type: string }
        booth_ids: { type: array, items: { type: string } }
        beneficiary_version: { $ref: '#/components/schemas/Version' }
        active_contract_version: { $ref: '#/components/schemas/SourceVersionRef' }
        beneficiary_id: { type: string, x-encore-proposal: Q3 }
        booths: { type: array, items: { $ref: '#/components/schemas/Booth' }, x-encore-proposal: Q3 }
        fictional_notice: { type: string, x-encore-proposal: Q3 }
    OrderLine:
      type: object
      additionalProperties: false
      required: [line_id, quantity, eligible_net_cents, tax_cents, tips_cents, gross_cents, source_refs]
      properties:
        line_id: { type: string }
        quantity: { type: integer }
        eligible_net_cents: { $ref: '#/components/schemas/MoneyCents' }
        tax_cents: { $ref: '#/components/schemas/MoneyCents' }
        tips_cents: { $ref: '#/components/schemas/MoneyCents' }
        gross_cents: { $ref: '#/components/schemas/MoneyCents' }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        line_no: { type: integer, x-encore-proposal: Q3 }
        description: { type: string, x-encore-proposal: Q3 }
        item_sku: { type: string, x-encore-proposal: Q3 }
        unit_price_cents: { $ref: '#/components/schemas/MoneyCents', x-encore-proposal: Q3 }
        refund_of_line_id: { type: string, x-encore-proposal: Q3 }
    Order:
      type: object
      additionalProperties: false
      required: [id, version, status, source_native_id, vendor_id, business_date, ordered_at, lines, eligible_net_cents, tax_cents, tips_cents, gross_cents, source_refs]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        source_native_id: { type: string }
        vendor_id: { type: string }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        ordered_at: { $ref: '#/components/schemas/Instant' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        eligible_net_cents: { $ref: '#/components/schemas/MoneyCents' }
        tax_cents: { $ref: '#/components/schemas/MoneyCents' }
        tips_cents: { $ref: '#/components/schemas/MoneyCents' }
        gross_cents: { $ref: '#/components/schemas/MoneyCents' }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        recorded_at: { $ref: '#/components/schemas/Instant' }
        festival_id: { type: string, x-encore-proposal: Q3 }
        booth_id: { type: string, x-encore-proposal: Q3 }
        source_system: { type: string, x-encore-proposal: Q3 }
        kind: { type: string, enum: [SALE, REFUND], x-encore-proposal: Q3 }
        refund_of_order_id: { type: string, x-encore-proposal: Q3 }
        refund_reason: { type: string, x-encore-proposal: Q3 }
    OrderAllocation:
      type: object
      additionalProperties: false
      required: [order_id, amount_cents]
      properties:
        order_id: { type: string }
        amount_cents: { $ref: '#/components/schemas/MoneyCents' }
    Payment:
      type: object
      additionalProperties: false
      required: [id, version, status, order_refs, vendor_id, method, custody, amount_cents, currency, provider_reference, source_refs]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        order_refs: { type: array, items: { $ref: '#/components/schemas/OrderAllocation' } }
        vendor_id: { type: string }
        method: { type: string, enum: [CARD, CASH, WRISTBAND] }
        custody: { $ref: '#/components/schemas/Custody' }
        amount_cents: { $ref: '#/components/schemas/MoneyCents' }
        currency: { $ref: '#/components/schemas/Currency' }
        provider_reference: { type: string }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        business_date: { $ref: '#/components/schemas/BusinessDate', x-encore-proposal: Q3 }
        occurred_at: { $ref: '#/components/schemas/Instant', x-encore-proposal: Q3 }
        festival_id: { type: string, x-encore-proposal: Q3 }
        kind: { type: string, enum: [CAPTURE, REFUND, CHARGEBACK], x-encore-proposal: Q3 }
        cash_drawer: { type: [string, 'null'], enum: [VENDOR, ORGANIZER_CASH_OFFICE, null], x-encore-proposal: Q3 }
        processor_batch_id: { type: [string, 'null'], x-encore-proposal: Q3 }
        processor_fee_cents: { anyOf: [{ $ref: '#/components/schemas/MoneyCents' }, { type: 'null' }], x-encore-proposal: Q3 }
        provider: { type: [string, 'null'], x-encore-proposal: Q3 }
        refund_of_payment_id: { type: string, x-encore-proposal: Q3 }
    BankEntry:
      type: object
      additionalProperties: false
      required: [id, version, status, account_id, provider_reference, amount_cents, occurred_at, direction, source_refs]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        account_id: { type: string }
        provider_reference: { type: string }
        amount_cents: { $ref: '#/components/schemas/NonNegativeMoneyCents' }
        occurred_at: { $ref: '#/components/schemas/Instant' }
        direction: { $ref: '#/components/schemas/BankDirection' }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        currency: { $ref: '#/components/schemas/Currency', x-encore-proposal: Q3 }
        description: { type: string, x-encore-proposal: Q3 }
    ProcessorBatch:
      type: object
      additionalProperties: false
      x-encore-proposal: Q3
      required: [id, version, status, provider, provider_reference, business_date, currency, gross_cents, fees_cents, net_cents, payment_ids, source_refs]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        provider: { type: string }
        provider_reference: { type: string }
        payout_reference: { type: string }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        currency: { $ref: '#/components/schemas/Currency' }
        gross_cents: { $ref: '#/components/schemas/MoneyCents' }
        fees_cents: { $ref: '#/components/schemas/MoneyCents' }
        net_cents: { $ref: '#/components/schemas/MoneyCents' }
        payment_count: { type: integer }
        payment_ids: { type: array, items: { type: string } }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
    CashCount:
      type: object
      additionalProperties: false
      x-encore-proposal: Q3
      required: [id, version, status, festival_id, vendor_id, booth_id, business_date, custody, location, amount_cents, currency, counted_at, source_refs]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        festival_id: { type: string }
        vendor_id: { type: string }
        booth_id: { type: string }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        custody: { $ref: '#/components/schemas/Custody' }
        location: { type: string }
        amount_cents: { $ref: '#/components/schemas/NonNegativeMoneyCents' }
        currency: { $ref: '#/components/schemas/Currency' }
        counted_at: { $ref: '#/components/schemas/Instant' }
        counted_by_role: { type: string }
        source_native_id: { type: string }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
    SourceDocument:
      type: object
      additionalProperties: false
      x-encore-proposal: Q23
      required: [id, version, status, kind, title, media_type, content_hash, byte_length]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        kind: { type: string }
        title: { type: string }
        media_type: { type: string }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        byte_length: { type: integer, minimum: 0 }
        parser_version: { type: [string, 'null'] }
        path: { type: string, description: Fixture-relative path; a live API serves content via an authorized reference instead. }
        vendor_id: { type: [string, 'null'] }
        received_at: { $ref: '#/components/schemas/Instant' }
    BankAccount:
      type: object
      additionalProperties: false
      x-encore-proposal: Q23
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        opening_as_of: { $ref: '#/components/schemas/BusinessDate' }
        opening_balance_cents: { $ref: '#/components/schemas/MoneyCents' }
        source_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
    Festival:
      type: object
      additionalProperties: false
      x-encore-proposal: Q23
      required: [id, version, status, name, timezone, currency, start_date, end_date, business_dates]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        name: { type: string }
        organizer_name: { type: string }
        timezone: { type: string, const: America/Los_Angeles }
        currency: { $ref: '#/components/schemas/Currency' }
        start_date: { $ref: '#/components/schemas/BusinessDate' }
        end_date: { $ref: '#/components/schemas/BusinessDate' }
        business_dates: { type: array, items: { $ref: '#/components/schemas/BusinessDate' } }
        business_config_id: { type: string }
        bank_accounts: { type: array, items: { $ref: '#/components/schemas/BankAccount' } }
        fictional_notice: { type: string }
    BusinessConfig:
      type: object
      x-encore-proposal: Q23
      description: C05 configuration (DRAFT). Shape is lane-B fixture shape; nested objects are open.
      required: [id, version, status, festival_id, currency, timezone]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { type: string }
        festival_id: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        timezone: { type: string }
        draft_notice: { type: string }
        default_terms:
          type: object
          properties:
            commission_bps: { $ref: '#/components/schemas/BasisPoints' }
            festival_minimum_cents: { $ref: '#/components/schemas/MoneyCents' }
        payout_controls:
          type: object
          properties:
            auto_limit_cents_per_vendor_day: { $ref: '#/components/schemas/MoneyCents' }
            payment_mode: { type: string, enum: [SIMULATED] }
            statement_local_time: { type: string }
            payout_local_time: { type: string }
        tax:
          type: object
          properties:
            rate: { $ref: '#/components/schemas/DecimalString' }
            label: { type: string }
            report_status: { type: string }
        draft_assumptions:
          type: object
          additionalProperties: { type: string }

    # ----------------------------------- C03 output records (no fixture yet)
    Run:
      type: object
      required: [id, version, status, business_date]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { $ref: '#/components/schemas/RunStatus' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        branch_id: { type: [string, 'null'] }
        started_at: { $ref: '#/components/schemas/Instant' }
        completed_at: { anyOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
        festival_id: { type: string, x-encore-proposal: Q30 }
        vendor_summary: { $ref: '#/components/schemas/RunVendorSummary', x-encore-proposal: Q30 }
    RunVendorSummary:
      type: object
      x-encore-proposal: Q30
      description: >-
        Server-derived counts of vendor runs by state (C04: completion is derived from all vendor
        obligations). The UI displays these; it does not recount.
      required: [total, active, held, failed, completed]
      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        held: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
    VendorRunState:
      type: string
      x-encore-proposal: Q30
      description: >-
        ACTIVE = progressing; HELD = waiting at `milestone` for an authorized command; FAILED = needs
        operator action; COMPLETED = all milestones through CONTROLS_CHECKED (or APPROVED) reached.
      enum: [ACTIVE, HELD, FAILED, COMPLETED]
    Hold:
      type: object
      x-encore-proposal: Q32
      required: [reason_code, description, blocking]
      properties:
        reason_code: { type: string }
        description: { type: string, description: User-safe reason the hold exists. }
        blocking: { type: boolean, description: True when it blocks statement finalization or payout release. }
        case_id: { type: [string, 'null'] }
        since: { $ref: '#/components/schemas/Instant' }
    VendorRun:
      type: object
      x-encore-proposal: Q30
      required: [id, version, run_id, vendor_id, business_date, milestone, state, holds, case_ids, updated_at]
      properties:
        id: { type: string }
