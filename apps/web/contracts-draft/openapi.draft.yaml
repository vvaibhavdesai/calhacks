# =============================================================================
#  TEMPORARY LANE-B DRAFT. NOT THE CONTRACT AUTHORITY.
#
#  Transcribed by lane B from CONTRACTS.md v0.1 (C01, C03, C04: all DRAFT) so
#  the frontend can generate types instead of hand-maintaining shapes.
#  It must be REPLACED by lane A's generated OpenAPI from packages/contracts
#  (Pydantic) once C03 is reviewed/frozen. See apps/web/README.md
#  "Swapping the draft contract".
#
#  Conventions in this file:
#   - Anything without `x-encore-proposal` is transcribed from CONTRACTS.md.
#   - `x-encore-proposal: <ref>` marks a lane-B proposal (field or route) that
#     is NOT in CONTRACTS.md; <ref> points at docs/progress/lane-b.md
#     (contract question Qn or assumption DAnn).
#   - `x-encore-unspecified: true` marks a schema CONTRACTS.md names but does
#     not define; the shape is a minimal placeholder.
#   - Fixture-backed input records use additionalProperties: false so the
#     conformance test catches drift between the compact fixture and this
#     draft. The runtime client does not reject unknown fields.
# =============================================================================
openapi: 3.1.0
info:
  title: Encore API (lane B DRAFT transcription of CONTRACTS.md C03)
  version: 0.1.0-draft.lane-b
  description: >-
    DRAFT. Transcribed from CONTRACTS.md v0.1 C01/C03/C04. Not frozen, not
    reviewed by lane A. Money is USD integer cents as base-10 strings; instants
    are UTC RFC3339; business_date is YYYY-MM-DD in America/Los_Angeles.
servers:
  - url: /api/v1
tags:
  - name: reads
  - name: commands
  - name: proposals
    description: Routes proposed by lane B, not present in CONTRACTS.md.

paths:
  # ---------------------------------------------------------------- proposals
  /session:
    get:
      tags: [proposals]
      x-encore-proposal: Q22
      operationId: getSession
      summary: Authenticated actor and backend-granted capabilities (PROPOSAL).
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /festival:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: getFestival
      responses:
        '200':
          description: The festival in scope for this workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festival' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /business-config:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: getBusinessConfig
      responses:
        '200':
          description: Active versioned business configuration (C05, DRAFT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessConfig' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /payments:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Payments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bank-entries:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listBankEntries
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: direction
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BankDirection' }
      responses:
        '200':
          description: Bank entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankEntryList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /processor-batches:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listProcessorBatches
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Processor batches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessorBatchList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cash-counts:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listCashCounts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Cash counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCountList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /source-documents:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listSourceDocuments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
      responses:
        '200':
          description: Source document metadata. Content is served separately (authorized).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDocumentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /source-documents/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: getSourceDocument
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Source document metadata.
          content:
            application/json:
