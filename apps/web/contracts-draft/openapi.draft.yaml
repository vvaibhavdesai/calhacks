    # ---------------------------------------------------------- C03 events
    EventEnvelope:
      type: object
      required: [event_id, type, schema_version, cursor, stream_sequence, aggregate_id, aggregate_version, occurred_at, recorded_at]
      properties:
        event_id: { type: string }
        type: { type: string }
        schema_version: { type: integer, minimum: 1 }
        cursor: { type: string, description: Opaque resume cursor. }
        stream_sequence:
          type: integer
          minimum: 1
          x-encore-proposal: Q25
          description: Monotonic per stream (C06 stream_id/sequence); used for gap detection.
        aggregate_id: { type: string }
        aggregate_version: { $ref: '#/components/schemas/Version' }
        run_id: { type: [string, 'null'] }
        vendor_id: { type: [string, 'null'] }
        branch_id: { type: [string, 'null'] }
        occurred_at: { $ref: '#/components/schemas/Instant' }
        recorded_at: { $ref: '#/components/schemas/Instant' }
        causation_id: { type: [string, 'null'] }
        correlation_id: { type: [string, 'null'] }
        actor_ref: { type: [string, 'null'] }
        payload: { type: object, additionalProperties: true, description: Authorized safe payload or ref. Never grants permissions. }
        # ---- C06 required fields not yet in the C03 envelope, plus display fields (lane-B proposal Q47)
        stream_id: { type: string, x-encore-proposal: Q47 }
        category:
          $ref: '#/components/schemas/EventCategory'
          x-encore-proposal: Q47
        summary: { type: string, x-encore-proposal: Q47, description: User-safe one-line statement of what was recorded. Never hidden model reasoning. }
        aggregate_type: { $ref: '#/components/schemas/RecordKind', x-encore-proposal: Q47 }
        actor_id: { type: [string, 'null'], x-encore-proposal: Q47 }
        actor_type: { $ref: '#/components/schemas/ActorType', x-encore-proposal: Q47 }
        actor_label: { type: [string, 'null'], x-encore-proposal: Q47 }
        capability: { type: [string, 'null'], x-encore-proposal: Q47, description: Capability the actor exercised (C04 "log actual actor and capability"). }
        command_id: { type: [string, 'null'], x-encore-proposal: Q47 }
        business_date: { anyOf: [{ $ref: '#/components/schemas/BusinessDate' }, { type: 'null' }], x-encore-proposal: Q47 }
        backdated:
          type: boolean
          x-encore-proposal: Q47
          description: Server flag. True when the fact was recorded materially later than it occurred / took business effect ("recorded later, effective earlier").
        versions: { $ref: '#/components/schemas/EventVersions', x-encore-proposal: Q47 }
        input_refs: { type: array, items: { $ref: '#/components/schemas/SourceRef' }, x-encore-proposal: Q47 }
        links: { type: array, items: { $ref: '#/components/schemas/RecordRef' }, x-encore-proposal: Q47, description: Records this event concerns (actor, run, vendor, case, policy, payout, journal entry...). }
        previous_hash: { type: [string, 'null'], x-encore-proposal: Q47 }
        hash: { type: string, x-encore-proposal: Q47 }
    EventCategory:
      type: string
      x-encore-proposal: Q47
      description: >-
        FACT = recorded fact (ingestion, human decision, state transition, posting). PROPOSAL = agent
        proposal, never an approval. INTENT = attempted action logged before/while awaiting an external
        outcome, not a confirmed effect. EFFECT = confirmed external outcome. PROJECTION = derived,
        rebuildable calculation or view.
      enum: [FACT, PROPOSAL, INTENT, EFFECT, PROJECTION]
    ActorType:
      type: string
      x-encore-proposal: Q47
      enum: [HUMAN, AGENT, SYSTEM, EXTERNAL]
    RecordKind:
      type: string
      x-encore-proposal: Q47
      enum: [RUN, VENDOR, CASE, POLICY_VERSION, SETTLEMENT, PAYOUT, JOURNAL_ENTRY, SOURCE_DOCUMENT, REPORT, APPROVAL, CHALLENGE, CORRECTION, BRANCH, REPLAY, ACTOR]
    RecordRef:
      type: object
      x-encore-proposal: Q47
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/RecordKind' }
        id: { type: string }
        version: { type: [integer, 'null'] }
        label: { type: [string, 'null'] }
    EventVersions:
      type: object
      x-encore-proposal: Q47
      description: Versions in force for this event (C06), when applicable.
      properties:
        model: { type: [string, 'null'] }
        prompt: { type: [string, 'null'] }
        tool: { type: [string, 'null'] }
        config: { type: [string, 'null'] }
        calculation: { type: [string, 'null'] }
        posting_rule: { type: [string, 'null'] }
        policy_version_ids: { type: array, items: { type: string } }

    # ------------------------------------------- B06 history / corrections (lane-B proposals Q48-Q53)
    ProjectionSnapshotRef:
      type: object
      x-encore-proposal: Q48
      description: Derived, rebuildable snapshot the reconstruction started from (C06).
      required: [snapshot_id, stream_cursor, projection_schema_version, state_hash, taken_at]
      properties:
        snapshot_id: { type: string }
        stream_cursor: { type: string }
