      operationId: getBranch
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Isolated what-if branch with its production comparison.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /replays/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q53
      operationId: getReplay
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Side-effect-free replay with progress, effect counters and results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Replay' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/stream:
    get:
      tags: [reads]
      operationId: streamEvents
      summary: SSE notification stream. Notification only, never a second ledger or a permission grant.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque resume cursor (the last received EventEnvelope.cursor). Also sent as Last-Event-ID.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            text/event-stream. Each `data:` line is one JSON EventEnvelope; the SSE `id:` field
            carries EventEnvelope.cursor. A control event of type `stream.resync_required` means the
            client must refetch projections and reconnect without a cursor.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          x-encore-proposal: Q25
          description: Resume cursor expired; client must resync projections and reconnect without a cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ------------------------------------------------------- C03 commands
  /imports:
    post:
      tags: [commands]
      operationId: createImport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /challenges/{challenge_id}/withdraw:
    post:
      tags: [proposals]
      operationId: withdrawChallenge
      description: >-
        Withdraw an open challenge. The server reactivates a policy version it
        suspended (app/corrections.py withdraw_challenge) and releases the
        holds the challenge placed. Without this the UI could raise a challenge
        and never undo it: a policy stayed SUSPENDED with no control to restore
        it.
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /challenges:
    get:
      tags: [proposals]
      x-encore-proposal: Q49
      operationId: listChallenges
      description: Challenges, newest first (PROPOSAL).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: target_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: List.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [commands]
      operationId: createChallenge
      description: >-
        payload is CreateChallengePayload (proposal Q49). expected_version is the challenged target's
        optimistic version (policy record_version, settlement or payout version). Creating a challenge
        pauses use of the affected policy version server-side; it changes no money by itself.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /corrections/preview:
    post:
      tags: [commands]
      operationId: previewCorrection
      description: >-
        payload is PreviewCorrectionPayload (proposal Q50); expected_version is the challenge version.
        Returns the correction id (CommandResult.aggregate_id); GET /corrections/{id} serves the preview.
        A preview changes no financial state.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /corrections/{id}/approve:
    post:
      tags: [commands]
      operationId: approveCorrection
      description: >-
        payload is ApproveCorrectionPayload (proposal Q51); expected_version is the correction version.
        Binds the exact preview_hash and evidence_hash shown to the approver. Usually 202 + job: the
        correction executes asynchronously and reports progress on GET /corrections/{id}.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /branches:
    get:
      tags: [proposals]
      x-encore-proposal: Q52
      operationId: listBranches
      description: What-if branches (isolated storage, external effects disabled).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [commands]
      operationId: createBranch
      description: >-
        payload is CreateBranchPayload (proposal Q52); expected_version is null. A branch is isolated
        storage with external effects disabled. There is no promote/merge route: changing production
        needs a new reviewed production command (C06).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /replays:
    get:
      tags: [proposals]
      x-encore-proposal: Q53
      operationId: listReplays
      description: Replays, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [commands]
      operationId: createReplay
      description: >-
        payload is StartReplayPayload (proposal Q53); expected_version is null. Replays consume recorded
        results only: no live model calls, no payments, no production postings (C06).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses

components:
  parameters:
    FestivalId:
      name: festival_id
      in: query
      required: false
      description: >-
        Which festival to read. The live backend REQUIRES it on these routes and
        answers 422 "Field required" without it; it is declared optional here
        only so a client may omit it while the id is still being fetched.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous next_cursor. Never parsed by clients.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      x-encore-proposal: Q24
      schema: { type: integer, minimum: 1, maximum: 200 }
    Sort:
      name: sort
      in: query
      required: false
      x-encore-proposal: Q24
      description: Server-side sort, `field` or `-field`. Ordering must remain stable (ties by id).
      schema: { type: string, pattern: '^-?[a-z_]+$' }
    VendorId:
      name: vendor_id
      in: query
      required: false
      schema: { type: string }
    BusinessDate:
      name: business_date
      in: query
      required: false
      schema: { $ref: '#/components/schemas/BusinessDate' }
    SupplierId:
      name: supplier_id
      in: query
      required: false
      x-encore-proposal: Q41
      schema: { type: string }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for effectful commands; scoped by workspace/action. Same key + same canonical
        payload returns the original result; same key + different payload returns 409.
      schema: { type: string, minLength: 8, maxLength: 200 }

  requestBodies:
    Command:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommandEnvelope' }

  responses:
    Unauthenticated:
      description: 401 unauthenticated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 403 forbidden (authenticated but lacks capability).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 404 not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 409 conflict (version mismatch or idempotency key reused with different payload).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Invalid:
      description: 422 invalid input or domain precondition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 429 rate limited.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: 503 dependency unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ------------------------------------------------------------ C01 basics
    MoneyCents:
      description: >-
        USD integer cents (C01). The backend sends a JSON integer; the dev/test fixtures carry
        the same value as a canonical base-10 string, so both forms are accepted and
        src/lib/money.ts is the only module that reads either. Never a float. A leading '-'
        for refunds is a DRAFT assumption (DA07, open question Q4); '-0' and leading zeros are
        not canonical.
      anyOf:
        - type: integer
        - type: string
          pattern: '^-?(0|[1-9][0-9]*)$'
          not: { const: '-0' }
    NonNegativeMoneyCents:
      description: USD integer cents, never negative. Backend integer or fixture string (see MoneyCents).
      anyOf:
        - type: integer
          minimum: 0
        - type: string
          pattern: '^(0|[1-9][0-9]*)$'
    Currency:
      type: string
      enum: [USD]
    BusinessDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: YYYY-MM-DD festival business date in America/Los_Angeles.
    Instant:
      type: string
      format: date-time
      pattern: '(Z|[+-]00:00)$'
      description: >-
        UTC RFC3339 instant. The backend emits both "...Z" and Python's
        "...+00:00" (datetime.isoformat on a UTC datetime); a non-zero offset is
        not an instant on this wire.
    Version:
      type: integer
      minimum: 1
    BasisPoints:
      type: integer
      minimum: 0
      maximum: 10000
    DecimalString:
      type: string
      pattern: '^[0-9]+\.[0-9]+$'
    SourceRef:
      type: object
      additionalProperties: false
      required: [source_id, source_version, content_hash, locator_kind, locator]
      properties:
        source_id: { type: string }
        source_version: { $ref: '#/components/schemas/Version' }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        locator_kind: { type: string, enum: [row, page, span] }
        locator: { type: string, minLength: 1 }
