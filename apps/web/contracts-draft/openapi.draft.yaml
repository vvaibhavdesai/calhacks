  /invoices:
    get:
      tags: [reads]
      operationId: listSupplierInvoices
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Supplier invoices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierInvoiceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /journal:
    get:
      tags: [reads]
      operationId: listJournalEntries
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Journal entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/tax:
    get:
      tags: [reads]
      operationId: listTaxReports
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: DRAFT, NOT FILED tax summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxReportList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cash:
    get:
      tags: [reads]
      operationId: listCashPositions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
