# =============================================================================
#  TEMPORARY LANE-B DRAFT. NOT THE CONTRACT AUTHORITY.
#
#  Transcribed by lane B from CONTRACTS.md v0.1 (C01, C03, C04: all DRAFT) so
#  the frontend can generate types instead of hand-maintaining shapes.
#  It must be REPLACED by lane A's generated OpenAPI from packages/contracts
#  (Pydantic) once C03 is reviewed/frozen. See apps/web/README.md
#  "Swapping the draft contract".
#
#  Conventions in this file:
#   - Anything without `x-encore-proposal` is transcribed from CONTRACTS.md.
#   - `x-encore-proposal: <ref>` marks a lane-B proposal (field or route) that
#     is NOT in CONTRACTS.md; <ref> points at docs/progress/lane-b.md
#     (contract question Qn or assumption DAnn).
#   - `x-encore-unspecified: true` marks a schema CONTRACTS.md names but does
#     not define; the shape is a minimal placeholder.
#   - Fixture-backed input records use additionalProperties: false so the
#     conformance test catches drift between the compact fixture and this
#     draft. The runtime client does not reject unknown fields.
# =============================================================================
openapi: 3.1.0
info:
  title: Encore API (lane B DRAFT transcription of CONTRACTS.md C03)
  version: 0.1.0-draft.lane-b
  description: >-
    DRAFT. Transcribed from CONTRACTS.md v0.1 C01/C03/C04. Not frozen, not
    reviewed by lane A. Money is USD integer cents as base-10 strings; instants
    are UTC RFC3339; business_date is YYYY-MM-DD in America/Los_Angeles.
servers:
  - url: /api/v1
tags:
  - name: reads
  - name: commands
  - name: proposals
    description: Routes proposed by lane B, not present in CONTRACTS.md.

paths:
  # ---------------------------------------------------------------- proposals
  /session:
    get:
      tags: [proposals]
      x-encore-proposal: Q22
      operationId: getSession
      summary: Authenticated actor and backend-granted capabilities (PROPOSAL).
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /festival:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: getFestival
      responses:
        '200':
          description: The festival in scope for this workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festival' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /business-config:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: getBusinessConfig
      responses:
        '200':
          description: Active versioned business configuration (C05, DRAFT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessConfig' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /payments:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Payments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bank-entries:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listBankEntries
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: direction
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BankDirection' }
      responses:
        '200':
          description: Bank entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankEntryList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /processor-batches:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listProcessorBatches
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Processor batches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessorBatchList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cash-counts:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listCashCounts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Cash counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCountList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /source-documents:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: listSourceDocuments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VendorId'
      responses:
        '200':
          description: Source document metadata. Content is served separately (authorized).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDocumentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /source-documents/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q23
      operationId: getSourceDocument
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Source document metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDocument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /jobs/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q26
      operationId: getJob
      summary: Target of JobAccepted.status_url (PROPOSAL).
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------- C03 read collections
  /runs:
    get:
      tags: [reads]
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Close runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [commands]
      operationId: startRun
      summary: Start/resume a close run (effectful command).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: &commandResponses
        '200':
          description: Short accepted command; authoritative state/version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '202':
          description: Long job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /runs/{id}:
    get:
      tags: [reads]
      operationId: getRun
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/vendors:
    get:
      tags: [proposals]
      x-encore-proposal: Q30
      operationId: listRunVendors
      summary: Per-vendor workflow projection for one close run (C04 vendor milestones) (PROPOSAL).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/VendorRunState' }
      responses:
        '200':
          description: Vendor runs (one row per vendor in the run).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorRunList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /vendors:
    get:
      tags: [reads]
      operationId: listVendors
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Vendors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /vendors/{id}:
    get:
      tags: [reads]
      operationId: getVendor
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Vendor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settlements:
    get:
      tags: [reads]
      operationId: listSettlements
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Settlements (server-calculated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /settlements/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q32
      operationId: getSettlement
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Settlement and statement (server-calculated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases:
    get:
      tags: [reads]
      operationId: listCases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/VendorId'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CaseStatus' }
      responses:
        '200':
          description: Cases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q33
      operationId: getCase
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Case with evidence, impact, options and current state/version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases/{id}/resolve:
    post:
      tags: [commands]
      operationId: resolveCase
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /policies:
    get:
      tags: [reads]
      operationId: listPolicies
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: policy_id
          in: query
          required: false
          x-encore-proposal: Q34
          description: All versions of one logical policy.
          schema: { type: string }
        - name: status
          in: query
          required: false
          x-encore-proposal: Q34
          schema: { $ref: '#/components/schemas/PolicyStatus' }
      responses:
        '200':
          description: Policy versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /policies/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q34
      operationId: getPolicyVersion
      summary: One policy version by its id (PROPOSAL).
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Policy version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/{id}/approve:
    post:
      tags: [commands]
      operationId: approvePolicy
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /payouts:
    get:
      tags: [reads]
      operationId: listPayouts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
        - name: state
          in: query
          required: false
          x-encore-proposal: Q38
          schema: { $ref: '#/components/schemas/PayoutState' }
        - name: batch_id
          in: query
          required: false
          x-encore-proposal: Q38
          schema: { type: string }
      responses:
        '200':
          description: Payouts (simulated money movement in v1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /payouts/{id}/approve:
    post:
      tags: [commands]
      operationId: approvePayout
      description: >-
        payload is ApprovePayoutPayload (proposal Q39). Finance-lead approval of an amount above the
        automatic daily limit, bound to the exact payout version, amount and beneficiary version. It
        never waives hard blockers (unresolved discrepancy, changed beneficiary, insufficient cash).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /payouts/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q38
      operationId: getPayout
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Payout with gate checks, limit status and state history (SIMULATED money movement).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payout-batches:
    get:
      tags: [proposals]
      x-encore-proposal: Q38
      operationId: listPayoutBatches
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Payout release batches with server counts and totals (SIMULATED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /reconciliation:
    get:
      tags: [reads]
      operationId: listMatchGroups
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BusinessDate'
        - name: status
          in: query
          required: false
          x-encore-proposal: Q31
          schema: { $ref: '#/components/schemas/MatchGroupStatus' }
      responses:
        '200':
          description: Reconciliation match groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchGroupList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /reconciliation/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q31
      operationId: getMatchGroup
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Match group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchGroup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /suppliers:
    get:
      tags: [reads]
      operationId: listSuppliers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Suppliers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /purchase-orders:
    get:
      tags: [reads]
      operationId: listPurchaseOrders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SupplierId'
      responses:
        '200':
          description: Purchase orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invoices:
    get:
      tags: [reads]
      operationId: listSupplierInvoices
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SupplierId'
        - name: kind
          in: query
          required: false
          x-encore-proposal: Q41
          schema: { $ref: '#/components/schemas/SupplierInvoiceKind' }
      responses:
        '200':
          description: Supplier invoices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierInvoiceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invoices/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q41
      operationId: getSupplierInvoice
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Supplier invoice or credit note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierInvoice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /supplier-payments:
