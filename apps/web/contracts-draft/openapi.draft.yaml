        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /jobs/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q26
      operationId: getJob
      summary: Target of JobAccepted.status_url (PROPOSAL).
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------- C03 read collections
  /runs:
    get:
      tags: [reads]
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Close runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [commands]
      operationId: startRun
      summary: Start/resume a close run (effectful command).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: &commandResponses
        '200':
          description: Short accepted command; authoritative state/version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '202':
          description: Long job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /runs/{id}:
    get:
      tags: [reads]
      operationId: getRun
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/vendors:
    get:
      tags: [proposals]
      x-encore-proposal: Q30
      operationId: listRunVendors
      summary: Per-vendor workflow projection for one close run (C04 vendor milestones) (PROPOSAL).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/VendorRunState' }
      responses:
        '200':
          description: Vendor runs (one row per vendor in the run).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorRunList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /vendors:
    get:
      tags: [reads]
      operationId: listVendors
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Vendors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /vendors/{id}:
    get:
      tags: [reads]
      operationId: getVendor
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Vendor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settlements:
    get:
      tags: [reads]
      operationId: listSettlements
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Settlements (server-calculated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /settlements/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q32
      operationId: getSettlement
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Settlement and statement (server-calculated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases:
    get:
      tags: [reads]
      operationId: listCases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/VendorId'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CaseStatus' }
      responses:
        '200':
          description: Cases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q33
      operationId: getCase
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Case with evidence, impact, options and current state/version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases/{id}/resolve:
    post:
      tags: [commands]
      operationId: resolveCase
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /policies:
    get:
      tags: [reads]
      operationId: listPolicies
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: policy_id
          in: query
          required: false
          x-encore-proposal: Q34
          description: All versions of one logical policy.
          schema: { type: string }
        - name: status
          in: query
          required: false
          x-encore-proposal: Q34
          schema: { $ref: '#/components/schemas/PolicyStatus' }
      responses:
        '200':
          description: Policy versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /policies/{id}:
    get:
      tags: [proposals]
      x-encore-proposal: Q34
      operationId: getPolicyVersion
      summary: One policy version by its id (PROPOSAL).
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Policy version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/{id}/approve:
    post:
      tags: [commands]
      operationId: approvePolicy
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: *commandResponses
  /payouts:
    get:
      tags: [reads]
      operationId: listPayouts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Payouts (simulated money movement in v1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
