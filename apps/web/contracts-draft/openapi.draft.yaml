      type: object
      x-encore-proposal: Q48
      required: [record, label, status, recorded_at, occurred_at, backdated]
      properties:
        record: { $ref: '#/components/schemas/RecordRef' }
        label: { type: string }
        vendor_id: { type: [string, 'null'] }
        business_date: { anyOf: [{ $ref: '#/components/schemas/BusinessDate' }, { type: 'null' }] }
        status: { type: string }
        amount_cents: { anyOf: [{ $ref: '#/components/schemas/MoneyCents' }, { type: 'null' }] }
        amount_label: { type: [string, 'null'] }
        policy_version_id: { type: [string, 'null'] }
        recorded_at: { $ref: '#/components/schemas/Instant', description: Knowledge time of the version shown. }
        occurred_at: { $ref: '#/components/schemas/Instant', description: Business occurrence/effective time. }
        backdated: { type: boolean, description: Recorded later than it took effect. }
        note: { type: [string, 'null'] }
    LaterRecordedFact:
      type: object
      x-encore-proposal: Q48
      description: Recorded AFTER the cutoff but effective at or before it. Not part of the projection; listed so history never changes silently.
      required: [event_id, summary, occurred_at, recorded_at]
      properties:
        event_id: { type: string }
        summary: { type: string }
        category: { $ref: '#/components/schemas/EventCategory' }
        record: { anyOf: [{ $ref: '#/components/schemas/RecordRef' }, { type: 'null' }] }
        business_date: { anyOf: [{ $ref: '#/components/schemas/BusinessDate' }, { type: 'null' }] }
        occurred_at: { $ref: '#/components/schemas/Instant' }
        recorded_at: { $ref: '#/components/schemas/Instant' }
    HistoricalProjection:
      type: object
      x-encore-proposal: Q48
      required: [knowledge_cutoff, business_date, as_of_sequence, snapshot, events_applied, rows, recorded_later, generated_at]
      properties:
        knowledge_cutoff: { $ref: '#/components/schemas/Instant' }
        business_date: { anyOf: [{ $ref: '#/components/schemas/BusinessDate' }, { type: 'null' }] }
        vendor_id: { type: [string, 'null'] }
        branch_id: { type: [string, 'null'] }
        as_of_sequence: { type: integer, minimum: 0, description: Last stream_sequence included. }
        snapshot: { anyOf: [{ $ref: '#/components/schemas/ProjectionSnapshotRef' }, { type: 'null' }] }
        events_applied: { type: integer, minimum: 0, description: Events replayed on top of the snapshot. }
        rows: { type: array, items: { $ref: '#/components/schemas/HistoricalRow' } }
        recorded_later: { type: array, items: { $ref: '#/components/schemas/LaterRecordedFact' } }
        generated_at: { $ref: '#/components/schemas/Instant' }
    ChallengeStatus:
      type: string
      x-encore-proposal: Q49
      enum: [OPEN, PREVIEWED, CORRECTION_APPROVED, CORRECTED, WITHDRAWN]
    PausedWork:
      type: object
      x-encore-proposal: Q49
      required: [record, detail]
      properties:
        record: { $ref: '#/components/schemas/RecordRef' }
        detail: { type: string }
    ChallengePolicyEffect:
      type: object
      x-encore-proposal: Q49
      description: What the server paused when the challenge was recorded.
      required: [policy_version_id, status_before, status_now, paused_at, paused_work]
      properties:
        policy_version_id: { type: string }
        status_before: { $ref: '#/components/schemas/PolicyStatus' }
        status_now: { $ref: '#/components/schemas/PolicyStatus' }
        paused_at: { $ref: '#/components/schemas/Instant' }
        paused_work: { type: array, items: { $ref: '#/components/schemas/PausedWork' } }
    Challenge:
      type: object
      x-encore-proposal: Q49
      required: [id, version, status, target, reason, superseding_evidence, evidence_hash, created_at]
      properties:
        id: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        status: { $ref: '#/components/schemas/ChallengeStatus' }
        target: { $ref: '#/components/schemas/RecordRef' }
        reason: { type: string }
        superseding_evidence: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        evidence_hash: { type: string }
        policy_effect: { anyOf: [{ $ref: '#/components/schemas/ChallengePolicyEffect' }, { type: 'null' }] }
        # What the challenger says the rate should have been. Null when the
        # challenge only pauses the rule; a correction plan cannot be built
        # without it (app/corrections.py build_plan).
        proposed_effect:
          anyOf:
            - type: object
              additionalProperties: false
              required: [commission_bps]
              properties:
                commission_bps: { type: integer, minimum: 0, maximum: 10000 }
            - type: 'null'
        correction_id: { type: [string, 'null'] }
        created_by: { type: [string, 'null'] }
        capability: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Instant' }
        correlation_id: { type: [string, 'null'] }
    EvidenceCitation:
      type: object
      x-encore-proposal: Q49
      required: [source_id, source_version, content_hash]
      properties:
        source_id: { type: string }
        source_version: { $ref: '#/components/schemas/Version' }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        locator: { type: string }
    CreateChallengePayload:
      type: object
      x-encore-proposal: Q49
      description: payload of POST /challenges. Actor comes from the session.
      additionalProperties: false
      required: [action, target, superseding_evidence, reason]
      properties:
        action: { const: CHALLENGE }
        target:
          type: object
          additionalProperties: false
          required: [kind, id, version]
          properties:
            kind: { type: string, enum: [POLICY_VERSION, SETTLEMENT, PAYOUT] }
            id: { type: string }
            version: { $ref: '#/components/schemas/Version' }
        superseding_evidence: { type: array, minItems: 1, items: { $ref: '#/components/schemas/EvidenceCitation' } }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        proposed_effect:
          type: object
          additionalProperties: false
          description: >-
            What the rate should have been. Optional at creation -- a challenge
            without it still pauses the rule -- but a correction PLAN cannot be
            built without it (app/corrections.py build_plan raises
            PROPOSED_EFFECT_REQUIRED), so the impact preview and any approval
            need it.
          required: [commission_bps]
          properties:
            commission_bps: { type: integer, minimum: 0, maximum: 10000 }
    WithdrawChallengePayload:
