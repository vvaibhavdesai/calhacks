name: encore

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-encore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-encore_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-encore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - encore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-encore} -d ${POSTGRES_DB:-encore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-encore}:${POSTGRES_PASSWORD:-encore_dev_password}@postgres:5432/${POSTGRES_DB:-encore}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /repo
    entrypoint: ["uv", "run", "alembic", "-c", "db/migrations/alembic.ini", "upgrade", "head"]

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      # NOTE: deliberately the restricted `encore_app` role (A02, migration
      # 0003_app_role_privileges), not the schema-owning ${POSTGRES_USER}
      # role the `migrate` service below uses. encore_app cannot UPDATE or
      # DELETE business_events/source_versions/journal_entries/journal_lines
      # -- see docs/notes/audit-trust-boundary.md.
      DATABASE_URL: postgresql+psycopg://encore_app:${ENCORE_APP_DB_PASSWORD:-encore_app_dev_password}@postgres:5432/${POSTGRES_DB:-encore}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-local}
      DOCUMENT_STORAGE_ROOT: /data/documents
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Both intent types this system enqueues now have a dispatcher, so
      # nothing is PENDING "by design" any more -- see .env.example.
      OPS_OUTBOX_UNCONSUMED_INTENT_TYPES: ${OPS_OUTBOX_UNCONSUMED_INTENT_TYPES-}
    ports:
      - "8000:8000"
    volumes:
      - encore_documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      WORKER_HEALTH_PORT: "8100"
      # Same restricted `encore_app` role as the api service.
      DATABASE_URL: postgresql+psycopg://encore_app:${ENCORE_APP_DB_PASSWORD:-encore_app_dev_password}@postgres:5432/${POSTGRES_DB:-encore}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      APP_ENV: ${APP_ENV:-development}
      PAYMENT_MODE: simulated
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # The three work loops (worker/main.py). Each one claims its own work
      # from the database, so scaling this service out is safe.
      ORCHESTRATION_WORKER_ENABLED: ${ORCHESTRATION_WORKER_ENABLED:-1}
      OUTBOX_DISPATCHER_ENABLED: ${OUTBOX_DISPATCHER_ENABLED:-1}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-2}
      OUTBOX_BATCH: ${OUTBOX_BATCH:-20}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_RELEASE_WINDOW_ENABLED: ${OUTBOX_RELEASE_WINDOW_ENABLED:-1}
      # Blank SCHEDULE_FESTIVAL_ID = the scheduler runs but schedules
      # nothing, which is the safe default for a fresh database.
      SCHEDULE_FESTIVAL_ID: ${SCHEDULE_FESTIVAL_ID:-}
      SCHEDULE_ACTOR_EMAIL: ${SCHEDULE_ACTOR_EMAIL:-}
      SCHEDULE_STATEMENTS_AT: ${SCHEDULE_STATEMENTS_AT:-09:00}
      SCHEDULE_PAYOUT_RELEASE_AT: ${SCHEDULE_PAYOUT_RELEASE_AT:-10:00}
      SCHEDULE_FIRST_BUSINESS_DATE: ${SCHEDULE_FIRST_BUSINESS_DATE:-2026-10-16}
      SCHEDULE_LAST_BUSINESS_DATE: ${SCHEDULE_LAST_BUSINESS_DATE:-2026-10-18}
      DEMO_CLOCK_MODE: ${DEMO_CLOCK_MODE:-enabled}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # A10: same image as production (infra/web/Dockerfile): nginx serving the
  # built SPA and proxying /api to the api service on one origin. (The old
  # apps/web/Dockerfile build context could not see data/generator, which
  # the production-bundle guard needs.) For hot-reload development use
  # `npm run dev` in apps/web instead.
  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  encore_postgres_data:
  encore_documents:
