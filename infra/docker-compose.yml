name: encore

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-encore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-encore_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-encore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - encore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-encore} -d ${POSTGRES_DB:-encore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-encore}:${POSTGRES_PASSWORD:-encore_dev_password}@postgres:5432/${POSTGRES_DB:-encore}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /repo
    entrypoint: ["uv", "run", "alembic", "-c", "db/migrations/alembic.ini", "upgrade", "head"]

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-encore}:${POSTGRES_PASSWORD:-encore_dev_password}@postgres:5432/${POSTGRES_DB:-encore}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-local}
      DOCUMENT_STORAGE_ROOT: /data/documents
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - encore_documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      WORKER_HEALTH_PORT: "8100"
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  encore_postgres_data:
  encore_documents:
