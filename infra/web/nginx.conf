# A10: serve the built SPA and reverse-proxy the API on the same origin.
# TLS is terminated IN FRONT of this container (host load balancer / ingress /
# reverse proxy -- host not chosen yet, see docs/deploy.md). This server
# speaks plain HTTP on 8080 inside the private network only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Document uploads (POST /api/v1/imports) can be large PDFs.
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE notifications and long extraction batches.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /health/ {
        proxy_pass http://api:8000;
    }

    # /metrics is deliberately NOT proxied: scrape it on the private network.

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
