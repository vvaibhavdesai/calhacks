[alembic]
# Invoke from the repository root, e.g.:
#   uv run alembic -c db/migrations/alembic.ini upgrade head
# script_location is therefore relative to the repo root (the cwd alembic is
# run from), not relative to this ini file.
script_location = db/migrations
prepend_sys_path = services/api

# sqlalchemy.url is intentionally omitted: env.py requires DATABASE_URL from
# the environment and raises a clear error if it is missing, consistent with
# "missing credentials fail clearly".

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
